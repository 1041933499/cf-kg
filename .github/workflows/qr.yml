# ============================================================================
# 扫码登录添加账号 —— fork 用户免本地环境的账号配置方式
#
# 一次性前置（仓库 Settings → Secrets and variables → Actions → New repository secret）：
#   1. 创建 classic 令牌（只勾 repo 权限）：https://github.com/settings/tokens/new
#   2. Secret Name = KGGNB_PAT，Value = ghp_xxxx
#
# 使用：Actions → 扫码登录添加账号 → Run workflow（可改备注）
#   → 打开本次运行页的 【Summary】标签：直接显示二维码 PNG 图片，用概念版 APP 扫
#   → 日志「发布二维码图片」步骤里也有图片直链（点开就是 PNG，无压缩包）
#   → 扫码确认后自动校验并写入 Secret KGGNB（覆盖旧值）
#
# 实现说明：
#   - 二维码 PNG 被推到独立分支 qr-image（每次强制覆盖，不累积历史）
#   - 直链用 commit SHA 定位，避免 CDN 缓存导致扫到上一轮的过期码
#   - 运行日志/摘要公开：账号串（token）绝不打印，只经文件直接写入 Secret
#   - 二维码约 2 分钟有效、单次有效；他人扫到只会把 TA 自己的账号写进来，重跑即可覆盖
#   - Secret 不可读回：本工作流只能【覆盖】单账号；多账号请在本地用
#     scripts/kglogin.py 多次扫码后以 & 拼接，整体粘贴进 KGGNB
#   - KGGNB_PAT 只用于 gh secret set，建议只给 repo 权限
#   - 私有仓库 fork 无法用 raw 图（需登录），请改用 Artifacts 下载 login-qr
# ============================================================================

name: 扫码登录添加账号

on:
  workflow_dispatch:
    inputs:
      remark:
        description: "账号备注（写入账号串首段）"
        required: true
        default: "我的号"

concurrency:
  group: kglogin
  cancel-in-progress: true

permissions:
  contents: write      # 需要推送 qr-image 分支（二维码图片）
  actions: read

jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 检查 KGGNB_PAT（写入 Secret 所需令牌）
        env:
          KGGNB_PAT: ${{ secrets.KGGNB_PAT }}
        run: |
          if [ -z "$KGGNB_PAT" ]; then
            echo "::error::未配置 KGGNB_PAT — 需要一个带 repo 权限的令牌才能把扫码结果写入 Secret。创建 https://github.com/settings/tokens/new （classic，只勾 repo），再存入仓库 Secret：名称 KGGNB_PAT"
            exit 1
          fi

      - name: 生成二维码
        run: |
          python3 -m pip install --quiet qrcode
          python3 scripts/kglogin.py --create --session qr_session.json

      - name: 发布二维码图片（直链 + Summary 显示）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/qrimg && cp scripts/kg_login_qr.png /tmp/qrimg/qr.png
          cd /tmp/qrimg
          git init -q -b qr-image
          git add qr.png
          git -c user.name="github-actions" -c user.email="actions@users.noreply.github.com" \
              commit -qm "qr $(date +%s)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" qr-image
          SHA=$(git rev-parse HEAD)
          URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${SHA}/qr.png"
          echo "$URL" > "$GITHUB_WORKSPACE/qr_url.txt"
          echo "📱 二维码图片直链（复制到浏览器打开，点开就是 PNG）:"
          echo "$URL"
          {
            echo "## 📱 扫码登录二维码（约 2 分钟有效）"
            echo ""
            echo "![二维码](${URL})"
            echo ""
            echo "用【酷狗概念版 APP】扫码；过期请重新 Run workflow。"
            echo ""
            echo "图片直链：[${URL}](${URL})"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传二维码图片（私有仓库兜底备选）
        uses: actions/upload-artifact@v4
        with:
          name: login-qr
          path: scripts/kg_login_qr.png
          if-no-files-found: ignore
          retention-days: 1

      - name: 等待扫码
        env:
          REMARK: ${{ inputs.remark }}
        run: |
          echo "⏳ 等待扫码中（约 2.5 分钟）…"
          echo "📱 二维码图片: $(cat qr_url.txt)"
          python3 scripts/kglogin.py --poll --session qr_session.json \
            --seconds 150 --remark "$REMARK" --out kg_account.txt

      - name: 校验账号（只读 info）
        run: |
          KGGNB="$(cat kg_account.txt)" python3 scripts/kgcoin.py --target 1w --info

      - name: 写入 Secret KGGNB
        env:
          GH_TOKEN: ${{ secrets.KGGNB_PAT }}
        run: |
          gh secret set KGGNB --body "$(cat kg_account.txt)"
          echo "✅ 账号已保存到 Secret KGGNB（值不显示）"
          echo "📅 定时任务：每天北京 00:05 自动跑（Actions → 每日金币任务）"
          echo "👉 可去 Actions → 每日金币任务 → Run workflow → mode=info 再手动验证一次"
